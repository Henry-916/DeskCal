name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先移除截图和日志中的个人日程或其他隐私信息。
  - type: input
    id: version
    attributes:
      label: DeskCal 版本
      placeholder: 例如 0.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序说明如何稳定复现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附不含隐私的截图、日志或相关设置
