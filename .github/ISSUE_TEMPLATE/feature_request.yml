name: 功能建议
description: 提议现实可行、对用户有价值的新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述真实使用场景，而不只是功能名称
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 说明理想的交互和结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前如何绕过这个问题，或还有哪些实现方式
  - type: dropdown
    id: scope
    attributes:
      label: 主要影响范围
      options:
        - 日历与农历
        - 日程与提醒
        - 桌面与托盘
        - 数据导入导出
        - 可访问性与易用性
        - 其他
    validations:
      required: true
